name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'experimental/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # docker tags must be lowercase; the org name isn't
          image="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version}"

            # :latest only ever moves for a real release. Never a prerelease (1.0.0-rc1),
            # never a branch build - otherwise anyone pulling :latest silently gets
            # unfinished code, which is the whole reason experimental has its own tag.
            if [[ "${version}" != *-* ]]; then
              tags="${tags}"$'\n'"${image}:latest"
            fi

          elif [[ "${GITHUB_REF}" == refs/heads/experimental/* ]]; then
            tags="${image}:experimental"

          else
            tags="${image}:$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          fi

          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
